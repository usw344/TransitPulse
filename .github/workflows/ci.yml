name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: transitpulse
          POSTGRES_USER: transitpulse
          POSTGRES_PASSWORD: transitpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transitpulse -d transitpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRANSITPULSE_DATABASE_URL: postgresql+psycopg://transitpulse:transitpulse@localhost:5432/transitpulse
      TRANSITPULSE_ALLOW_DESTRUCTIVE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e "apps/api[dev]"
      - run: alembic upgrade head
      - run: pytest apps/api/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          API_BASE_URL: http://localhost:8000
