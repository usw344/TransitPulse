name: transitpulse

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transitpulse}
      POSTGRES_USER: ${POSTGRES_USER:-transitpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transitpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      TRANSITPULSE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-transitpulse}:${POSTGRES_PASSWORD:-transitpulse}@db:5432/${POSTGRES_DB:-transitpulse}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./migrations:/workspace/migrations
      - ./alembic.ini:/workspace/alembic.ini
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head && uvicorn transitpulse_api.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
  web_node_modules:
