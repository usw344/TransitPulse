[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transitpulse-api"
version = "0.1.0"
description = "TransitPulse FastAPI foundation"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "gtfs-realtime-bindings>=1.0,<2",
  "geoalchemy2>=0.16,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]

[project.scripts]
transitpulse-import-gtfs = "transitpulse_api.import_gtfs:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["transitpulse_api*"]
